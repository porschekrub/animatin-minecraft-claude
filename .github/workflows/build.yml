name: Build

# Builds the mod on every push, checks it loads on a server, then runs the game on a virtual display and takes a
# screenshot of every animation (published to the "ci-logs" branch). A tag like "v0.1.0" publishes a GitHub Release.
on:
  push:
    branches: [ "**", "!ci-logs" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          for try in 1 2 3 4; do
            ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log && break
            grep -q "Server returned HTTP response code: 5\|Connection reset\|Read timed out\|timeout (\|Could not GET\|Could not HEAD\|Failed to provision\|Could not resolve" build.log && [ $try -lt 4 ] || exit 1
            echo "download failed, trying again"; sleep 45
          done
          ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lifelikemotion-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Server test (the mod must not break a server)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          export LM_SMOKETEST=true
          timeout 1500 ./gradlew runServer --no-daemon > smoke.log 2>&1 || true
          tail -n 60 run/logs/latest.log || tail -n 80 smoke.log
          python3 tools/check_log.py run/logs/latest.log

      - name: Client test (virtual display, a screenshot of every animation)
        run: |
          cp run/logs/latest.log server-latest.log || true
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          pip install --quiet --break-system-packages pillow || true
          rm -rf run/saves/smoke && mkdir -p run/saves && cp -r run/world run/saves/smoke && rm -f run/saves/smoke/session.lock
          printf "onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:6\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nguiScale:2\nfov:0.0\n" > run/options.txt
          mkdir -p run/config && printf "earlyWindowControl = false\n" > run/config/fml.toml
          export LM_CLIENTSMOKE=true LIBGL_ALWAYS_SOFTWARE=1
          for try in 1 2 3; do
            rm -f run/logs/latest.log
            timeout 2400 xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew runClient --no-daemon > client.log 2>&1 || true
            grep -q "HttpTimeoutException\|SocketTimeoutException\|Connection reset\|Failed to download" client.log && [ ! -f run/logs/latest.log ] || break
            echo "download failed, trying again"; sleep 30
          done
          cp run/logs/latest.log client-latest.log || true
          tail -n 60 client-latest.log || tail -n 80 client.log
          python3 tools/check_log.py client-latest.log "CLIENT SMOKE OK"

      - name: Client test on a real Forge install (the built jar, as players get it)
        if: always()
        run: |
          curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/theorzr/portablemc/releases/latest > pmc-release.json
          U=$(python3 -c "
          import json; a=json.load(open('pmc-release.json')).get('assets', [])
          ok=[x['browser_download_url'] for x in a if 'linux' in x['name'].lower() and 'x86_64' in x['name'] and x['name'].endswith('.tar.gz')]
          print(ok[0] if ok else '')")
          mkdir -p pmc && for try in 1 2 3 4; do curl -sL "$U" | tar xz -C pmc && break; echo "portablemc download failed, trying again"; sleep 20; done
          PMC=$(find $PWD/pmc -type f -name portablemc | head -1); chmod +x $PMC
          M=$PWD/mc; rm -rf $M; mkdir -p $M/mods $M/saves $M/config
          cp build/libs/*.jar $M/mods/
          cp -r run/world $M/saves/smoke && rm -f $M/saves/smoke/session.lock
          cp run/options.txt $M/options.txt
          printf "earlyWindowControl = false\n" > $M/config/fml.toml
          export LIBGL_ALWAYS_SOFTWARE=1
          for try in 1 2 3; do
            rm -f $M/logs/latest.log
            timeout 2400 xvfb-run -a -s "-screen 0 1280x800x24" $PMC --main-dir $PWD/pmc-main start --mc-dir $M forge:1.20.1 -u Dev --join-world smoke --resolution 960x540 \
                --jvm-arg=-Dlifelikemotion.clientsmoke=true,-Dlifelikemotion.only=fp_sword+strip_chop+strip_pour+show_sword_twirl_wipe+carry_iron_sword+act_swim+phys_fall+tp_sword+emote_wave+mobs+items3d,-Xmx3G > prod-client.log 2>&1 || true
            [ -f $M/logs/latest.log ] && break
            echo "the game did not start (downloads?), trying again"; sleep 30
          done
          cp $M/logs/latest.log prod-client-latest.log || true
          mkdir -p run/screenshots-prod && cp -r $M/screenshots/* run/screenshots-prod/ 2>/dev/null || true
          tail -n 40 prod-client-latest.log || tail -n 60 prod-client.log
          python3 tools/check_log.py prod-client-latest.log "CLIENT SMOKE OK"

      - name: Publish logs and screenshots to the ci-logs branch
        if: always()
        run: |
          set +e
          D=/tmp/ci-logs
          mkdir -p $D
          cp build.log smoke.log client.log client-latest.log server-latest.log prod-client.log prod-client-latest.log $D/ 2>/dev/null
          python3 tools/shots.py run/screenshots-prod $D/screenshots-prod
          cp -r run/crash-reports $D/ 2>/dev/null
          python3 tools/shots.py run/screenshots $D/screenshots
          echo "${{ github.sha }} ${{ job.status }}" > $D/STATUS
          cd $D && git init -q && git checkout -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "logs for ${{ github.sha }}"
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs && break
            sleep $((i * 10))
          done
          exit 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lifelikemotion-jar
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Lifelike Motion ${{ github.ref_name }} (Forge 1.20.1)
          files: dist/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
